<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escher Mazes</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud" hidden>
  <div id="title"><b id="lname"></b><i id="lyear"></i></div>
  <div id="stats"><span id="keys"></span><span id="time"></span></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="touch">
    <button data-act="hint">Hint</button>
    <button data-act="use">Use</button>
    <button data-act="jump">Jump</button>
    <button data-act="pause">II</button>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="src/game.js"></script>
</body>
</html>
