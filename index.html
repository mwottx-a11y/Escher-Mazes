<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escher Mazes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Escher Mazes</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud" hidden>
  <div id="title"><b id="lname"></b><i id="lyear"></i></div>
  <div id="stats"><span id="keys"></span><span id="time"></span></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="stick" hidden><div id="knob"></div></div>
  <div id="touch">
    <button data-act="pause" aria-label="Pause">II</button>
    <button data-act="hint">Hint</button>
    <button data-act="jump" class="big">Jump</button>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="module" src="src/game.js"></script>
</body>
</html>
